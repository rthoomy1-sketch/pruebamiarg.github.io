<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehículos</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#e9e9e9;
}

/* HEADER */
.header{
  background:#312fc8;
  color:#fff;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.back{
  font-size:20px;
  cursor:pointer;
}

.title{
  font-size:18px;
  font-weight:600;
}

.reload{
  font-size:20px;
  cursor:pointer;
}

/* CONTENT */
.container{
  padding:12px;
}

/* INFO CARD */
.info{
  background:#7da6d1;
  border-radius:12px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#1f2d3d;
}

.info img{
  width:70px;
}

/* SERVICES CARD */
.card{
  background:#fff;
  border-radius:12px;
  margin-top:14px;
  padding:18px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card h3{
  margin:0 0 10px;
}

.card p{
  color:#555;
  font-size:14px;
}

.btn{
  margin-top:16px;
  background:#3d33c4;
  color:#fff;
  border:none;
  width:100%;
  padding:14px;
  border-radius:25px;
  font-size:16px;
  font-weight:600;
}

/* BOTTOM NAV */
.nav{
  position:fixed;
  bottom:0;
  width:100%;
  background:#f5f5f5;
  border-top:1px solid #ccc;
  display:flex;
  justify-content:space-around;
  padding:8px 0;
}

.nav div{
  text-align:center;
  font-size:12px;
  color:#777;
}

.nav .active{
  color:#312fc8;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="back" onclick="history.back()">←</div>
    <div class="title">Vehículos</div>
  </div>

  <!-- BOTÓN RECARGAR -->
  <div class="reload" onclick="location.reload()">⟳</div>
</div>

<!-- CONTENT -->
<div class="container">

  <div class="info">
    <p>
      Si viajás al exterior y no contás con cédula física y/o patente,
      comunicate con la <b>DNRPA</b> para asesorarte.
    </p>
    <img src="https://mi.argentina.gob.ar/img/2024/iconos/vencimiento_automotor.svg">
  </div>

  <div class="card">
    <h3>Agregá servicios</h3>
    <p>
      Asociá servicios para ver tu licencia de conducir y las cédulas
      de vehículos asociados a tu DNI.
    </p>

    <button class="btn">Agregar servicios</button>
  </div>

</div>

<!-- NAV -->
<div class="nav">
  <div class="active">Inicio</div>
  <div>Novedades</div>
  <div>Teléfonos</div>
  <div>Tina</div>
</div>

</body>
</html>
